<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preflight – find how your plan fails before it does</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070d;--glass:rgba(14,14,22,.68);--line:rgba(190,190,255,.12);--text:#ececf4;--mute:#8a8a9e;
  --a:160,160,240;--b:120,200,230;--hot:240,120,160;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eeeaff;--glass:rgba(255,255,255,.6);--line:rgba(90,70,200,.18);--text:#1a1642;--mute:#6a67a0;--a:100,80,230;--b:20,150,200;--hot:220,50,120}}
:root[data-theme="light"]{--bg:#eeeaff;--glass:rgba(255,255,255,.6);--line:rgba(90,70,200,.18);--text:#1a1642;--mute:#6a67a0;--a:100,80,230;--b:20,150,200;--hot:220,50,120}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;overflow-x:hidden}
.aurora{position:fixed;inset:0;pointer-events:none;background:
 radial-gradient(600px 400px at 15% 10%,rgba(var(--a),.28),transparent 70%),
 radial-gradient(500px 400px at 90% 80%,rgba(var(--b),.18),transparent 70%),
 radial-gradient(400px circle at var(--mx,50%) var(--my,50%),rgba(var(--a),.10),transparent 70%)}
main{position:relative;max-width:1080px;margin:0 auto;padding:36px 20px 80px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px;flex-wrap:wrap}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.03em}
header p{margin:6px 0 0;color:var(--mute);font-size:14px;max-width:46ch;line-height:1.6}
.pill{background:var(--glass);border:1px solid var(--line);color:var(--text);padding:8px 16px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer;transition:.3s;backdrop-filter:blur(16px)}
.pill:hover{box-shadow:0 0 26px rgba(var(--a),.4)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:22px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(30px) saturate(115%);-webkit-backdrop-filter:blur(30px) saturate(115%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 24px 70px -34px rgba(var(--a),.6)}
.add{display:flex;gap:10px;padding:10px;margin-bottom:18px;flex-wrap:wrap}
.add input{flex:1;min-width:180px;background:transparent;border:0;color:var(--text);font:inherit;font-size:15px;padding:12px 14px;outline:none}
.add input::placeholder{color:var(--mute)}
.go{border:0;border-radius:16px;padding:0 22px;min-height:44px;background:linear-gradient(135deg,rgb(var(--a)),rgb(var(--b)));color:#06061a;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 0 30px rgba(var(--a),.5);transition:.3s}
.go:hover{transform:translateY(-1px);box-shadow:0 0 44px rgba(var(--b),.6)}
button:focus-visible,input:focus-visible{outline:2px solid rgb(var(--b));outline-offset:2px}
.plane{position:relative;height:min(62vw,520px);min-height:340px;overflow:hidden;touch-action:none}
.plane::before{content:"";position:absolute;right:0;top:0;width:60%;height:60%;background:radial-gradient(circle at 100% 0,rgba(var(--hot),.08),transparent 70%);pointer-events:none}
.gl{position:absolute;background:var(--line)}
.ax{position:absolute;font-size:12px;color:var(--mute)}
.orb{position:absolute;border-radius:50%;transform:translate(-50%,50%);cursor:grab;display:grid;place-items:center;font-size:11px;font-weight:600;color:#06061a;
 background:radial-gradient(circle at 35% 30%,#fff,rgb(var(--c)) 55%);box-shadow:0 0 var(--g) rgba(var(--c),.8);transition:box-shadow .4s,width .6s cubic-bezier(.2,.8,.2,1),height .6s cubic-bezier(.2,.8,.2,1),left .6s cubic-bezier(.2,.8,.2,1),bottom .6s cubic-bezier(.2,.8,.2,1),transform .5s,opacity .5s,filter .5s;animation:pop .7s cubic-bezier(.2,.9,.3,1.2) backwards,breathe 4.5s ease-in-out .8s infinite;user-select:none}
.orb:active{cursor:grabbing;z-index:5}
.orb.sel{outline:2px solid var(--text);outline-offset:3px}
@keyframes pop{from{transform:translate(-50%,50%) scale(0);opacity:0}}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;opacity:0;transition:opacity .25s;z-index:9;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.side{padding:20px}
.side h2{font-size:15px;margin:0 0 4px;font-weight:600}
.risk{font-size:13px;color:var(--mute);margin:0 0 16px;line-height:1.5}
.big{font-size:44px;font-weight:700;letter-spacing:-.04em;background:linear-gradient(135deg,rgb(var(--hot)),rgb(var(--a)));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;transition:.3s}
.row:hover,.row.sel{background:rgba(var(--a),.08)}
.sc{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;background:rgba(var(--c),.18);color:rgb(var(--c));box-shadow:0 0 14px rgba(var(--c),.4)}
.nm{flex:1;font-size:14px;min-width:0;overflow-wrap:anywhere}
.x{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:6px}
.x:hover{color:var(--text)}
.fix{width:100%;margin-top:14px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--text);font:inherit;font-size:13px;resize:vertical;min-height:70px;outline:none}
.fixl{font-size:13px;margin-top:16px;color:var(--mute)}
.empty{color:var(--mute);font-size:13px;line-height:1.7;padding:6px 0}
@keyframes breathe{50%{box-shadow:0 0 calc(var(--g)*1.7) rgba(var(--c),.95)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes ping{to{transform:scale(2.8);opacity:0}}
.orb.drag{transition:box-shadow .4s,width .6s,height .6s;cursor:grabbing;z-index:5}
.orb.done{opacity:.4;filter:grayscale(.7)}
.orb.ping::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgb(var(--c));animation:ping .9s ease-out forwards}
.qz{position:absolute;font-size:12px;color:var(--mute);opacity:.55;pointer-events:none}
.qz.hot{color:rgb(var(--hot));opacity:.9}
.bar{height:5px;border-radius:9px;background:var(--line);margin:12px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,rgb(var(--b)),rgb(var(--a)),rgb(var(--hot)));box-shadow:0 0 14px rgba(var(--hot),.6);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.row.dn .nm{text-decoration:line-through;opacity:.55}
#fixwrap>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}
.chip{margin-top:12px;border:1px solid var(--line);background:rgba(var(--b),.1);color:var(--text);border-radius:12px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer;transition:.3s}
.chip:hover{box-shadow:0 0 22px rgba(var(--b),.45)}
.btns{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;display:flex;gap:14px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px 18px;font-size:13px;box-shadow:0 0 40px rgba(var(--a),.35);transition:.5s cubic-bezier(.2,.8,.2,1);z-index:20}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:rgb(var(--b));font:inherit;font-weight:600;cursor:pointer}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cat{background:var(--glass);border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:6px 14px;font:inherit;font-size:12px;cursor:pointer;transition:.35s;backdrop-filter:blur(12px);animation:rise .5s backwards}
.cat:hover{color:var(--text)}
.cat.on{color:var(--text);background:rgba(var(--a),.28);box-shadow:0 0 22px rgba(var(--a),.45)}
.orb.dim{opacity:.14;filter:blur(1.5px)}
.tag{font-size:11px;color:var(--mute);margin-top:2px}
.add select{background:var(--glass);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:0 12px;min-height:44px;font:inherit;font-size:13px;outline:none;cursor:pointer}
.add select option{background:var(--bg);color:var(--text)}
.spark{width:100%;height:64px;display:block;margin-top:10px;overflow:visible}
.draw{stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .4s;z-index:30;padding:20px}
.modal.show{opacity:1;pointer-events:auto}
.modal .card{padding:18px;max-width:min(92vw,820px);display:flex;flex-direction:column;gap:12px;align-items:center;transform:scale(.94) translateY(14px);transition:transform .55s cubic-bezier(.2,.8,.2,1);background:var(--bg)}
.modal.show .card{transform:none}
.modal img{max-width:100%;max-height:58vh;border-radius:16px}
.sim{margin:14px 0 4px}.sim .chip{margin-top:0;width:100%}
.surv{font-size:40px;font-weight:700;letter-spacing:-.04em;margin-top:14px;line-height:1;background:linear-gradient(135deg,rgb(var(--b)),rgb(var(--a)));-webkit-background-clip:text;background-clip:text;color:transparent}.surv span{font-size:20px}
.hist{display:flex;gap:6px;align-items:flex-end;height:70px;margin-top:12px}
.hist i{flex:1;height:0;min-height:3px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,rgb(var(--b)),rgba(var(--a),.5));transition:height .9s cubic-bezier(.2,.8,.2,1)}
.hist i.bad{background:linear-gradient(180deg,rgb(var(--hot)),rgba(var(--a),.4));box-shadow:0 0 14px rgba(var(--hot),.5)}
.hl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:6px}
.next{margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(var(--a),.07)}
.next:empty{display:none}.nm2{font-size:14px;margin-top:4px;overflow-wrap:anywhere}.next .chip{margin-top:10px}
.rank{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;margin-left:8px;background:rgba(var(--b),.15);color:rgb(var(--b));transition:.6s}.rank.hot{background:rgba(var(--hot),.18);color:rgb(var(--hot))}
.btns{flex-wrap:wrap;align-items:center}
input.fix{min-height:0;resize:none;margin-top:10px;color-scheme:light dark}
.tag.late{color:rgb(var(--hot));font-weight:600}
#sheet{display:none}
@media print{body>*:not(#sheet){display:none!important}#sheet{display:block;color:#000;background:#fff;padding:24px;font-family:system-ui,sans-serif}#sheet h1{font-size:22px;margin:0 0 6px}#sheet table{width:100%;border-collapse:collapse;margin-top:14px}#sheet td,#sheet th{border-bottom:1px solid #ccc;padding:8px;text-align:left;font-size:12px;vertical-align:top}}
#uni{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
main{z-index:1}
.aurora{display:none}
#uni{transition:opacity .6s;background:#07070d}
main{transition:opacity .7s,transform .7s}
body.explore{overflow:hidden;touch-action:none;cursor:grab}
body.explore.dragging{cursor:grabbing}
.explore main{opacity:0;pointer-events:none;transform:scale(.97)}
.xbar{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;pointer-events:none;display:flex;gap:14px;align-items:center;padding:10px 12px 10px 20px;border-radius:99px;background:rgba(18,18,24,.75);border:1px solid rgba(255,255,255,.14);color:#d8d8e0;font-size:13px;backdrop-filter:blur(16px);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s;z-index:25}
.explore .xbar{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.xbar button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:8px 16px;font:inherit;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="aurora"></div>
<main>
  <header>
    <div><h1>Preflight</h1><p>Imagine your plan has already failed. List why, then drag each cause to where it belongs: likely, damaging, or both.</p></div>
    <div class="btns"><span class="tag" id="sync"></span><button class="pill" id="xp" type="button">Explore universe</button><button class="pill" id="snd" type="button">Sound off</button><button class="pill" id="prt" type="button">Print plan</button><button class="pill" id="img" type="button">Export image</button><button class="pill" id="copy" type="button">Copy summary</button><button class="pill" id="theme" type="button">Switch theme</button></div>
  </header>
  <div class="grid">
    <section>
      <div class="glass add"><input id="inp" maxlength="60" placeholder="Why did it fail? e.g. The key person quit" aria-label="Failure cause"><select id="catsel" aria-label="Category"><option>People</option><option>Time</option><option>Money</option><option>Tech</option><option>Other</option></select><button class="go" id="add" type="button">Add risk</button></div>
      <div class="cats" id="presets"></div>
      <div class="cats" id="cats"></div>
      <div class="glass plane" id="plane">
        <div class="gl" style="left:50%;top:0;bottom:0;width:1px"></div><div class="gl" style="top:50%;left:0;right:0;height:1px"></div>
        <span class="ax" style="left:14px;top:10px">More damage ↑</span><span class="ax" style="right:14px;bottom:10px">More likely →</span>
        <span class="qz" style="left:14px;top:34px">Prepare</span><span class="qz hot" style="right:14px;top:10px">Fix now</span><span class="qz" style="left:14px;bottom:34px">Ignore</span><span class="qz" style="right:14px;bottom:34px">Watch</span>
        <div class="tip" id="tip"></div>
      </div>
    </section>
    <aside class="glass side">
      <h2>Plan danger <span class="rank" id="rank"></span></h2>
      <div class="big" id="total">0</div><div class="bar"><i id="barf"></i></div>
      <p class="risk" id="verdict">Add a risk to begin.</p>
      <svg class="spark" id="spark" viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true"></svg><div class="tag" id="sparkl"></div>
      <div class="sim"><button class="chip" id="run" type="button">Run 2,000 simulations</button><div id="simout"></div></div>
      <div class="next" id="next"></div>
      <div id="list"></div>
      <div id="fixwrap"></div>
    </aside>
  </div>
</main>
<script>
const $=id=>document.getElementById(id),plane=$('plane'),tip=$('tip');
let risks=[],sel=null,shown=0,hist=[],filt='All',first=true,lastC=null,prevS=null;const orbs=new Map(),CATS=['People','Time','Money','Tech','Other'];
try{hist=JSON.parse(localStorage.getItem('preflight-h')||'[]')}catch(e){}
const toastEl=document.createElement('div');toastEl.className='toast';document.body.appendChild(toastEl);let tt;
function toast(m,label,fn){toastEl.innerHTML='';const s=document.createElement('span');s.textContent=m;toastEl.appendChild(s);if(fn){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{fn();toastEl.classList.remove('show')};toastEl.appendChild(b)}toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),4500)}
function countTo(n){const from=shown,t0=performance.now();shown=n;$('barf').style.width=n+'%';(function f(t){const k=Math.min((t-t0)/800,1),e=1-Math.pow(1-k,3);$('total').textContent=Math.round(from+(n-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}
function burst(){const o=orbs.get(sel);if(!o)return;o.classList.add('ping');setTimeout(()=>o.classList.remove('ping'),900)}
try{risks=JSON.parse(localStorage.getItem('preflight')||'[]')}catch(e){}
if(!risks.length)risks=[{id:1,t:'Scope keeps growing',l:4.1,i:3.2,f:'',c:'Time'},{id:2,t:'Key person quits mid-project',l:1.6,i:4.6,f:'',c:'People'},{id:3,t:'Nobody wants the result',l:2.4,i:4.2,f:'',c:'Money'}];
const save=()=>{try{localStorage.setItem('preflight',JSON.stringify(risks))}catch(e){}cloudSave()};
const score=r=>r.l*r.i*(r.done?.3:1);
const col=s=>s>=14?'var(--hot)':s>=7?'var(--a)':'var(--b)';
function render(){
  const live=new Set();
  risks.forEach(r=>{
    live.add(r.id);
    const s=score(r),d=26+s*2.6;let o=orbs.get(r.id);
    if(!o){o=document.createElement('div');o.tabIndex=0;
      o.addEventListener('pointerdown',e=>drag(e,r,o));
      o.addEventListener('pointerenter',()=>{tip.textContent=r.t;tip.style.opacity=1});
      o.addEventListener('pointerleave',()=>tip.style.opacity=0);
      o.addEventListener('focus',()=>{if(sel!==r.id){sel=r.id;render()}});
      o.addEventListener('pointermove',e=>{const b=plane.getBoundingClientRect();tip.style.left=Math.min(e.clientX-b.left+14,b.width-200)+'px';tip.style.top=(e.clientY-b.top-34)+'px'});
      plane.appendChild(o);orbs.set(r.id,o)}
    o.className='orb'+(r.id===sel?' sel':'')+(r.done?' done':'')+(filt!=='All'&&(r.c||'Other')!==filt?' dim':'');
    o.style.cssText=`left:${r.l/5*100}%;bottom:${r.i/5*100}%;width:${d}px;height:${d}px;--c:${col(s)};--g:${10+s*2}px;--o:${d/2+9}px`;
    o.textContent=Math.round(s);o.setAttribute('aria-label',r.t+', score '+Math.round(s));
  });
  orbs.forEach((o,id)=>{if(!live.has(id)){orbs.delete(id);o.style.transform='translate(-50%,50%) scale(0)';o.style.opacity=0;setTimeout(()=>o.remove(),550)}});
  const sorted=[...risks].sort((a,b)=>score(b)-score(a));
  const tot=Math.round(risks.reduce((a,r)=>a+score(r),0)/Math.max(risks.length,1)*(1+risks.length*.08)*4);
  countTo(risks.length?Math.min(tot,100):0);snap(risks.length?Math.min(tot,100):0);drawCats();nextMove();rankIt(risks.length?Math.min(tot,100):0);
  const hi=risks.filter(r=>score(r)>=14).length;
  $('verdict').textContent=!risks.length?'Add a risk to begin.':hi?hi+(hi>1?' risks are':' risk is')+' in the red zone. Fix these first.':'No risk is in the red zone yet. Keep looking for blind spots.';
  const L=$('list');L.innerHTML='';
  if(!risks.length)L.innerHTML='<div class="empty">The map is empty. Name something that could sink the plan.</div>';
  sorted.forEach(r=>{
    const row=document.createElement('div');row.className='row'+(r.id===sel?' sel':'')+(r.done?' dn':'');
    row.innerHTML='<div class="sc"></div><div class="nm"></div><button class="x" aria-label="Delete risk">×</button>';
    row.querySelector('.sc').style.setProperty('--c',col(score(r)));row.querySelector('.sc').textContent=Math.round(score(r));
    row.querySelector('.nm').textContent=r.t;const tg=document.createElement('div');tg.className='tag';tg.textContent=(r.c||'Other')+(r.d&&!r.done?', due '+r.d:'');if(r.d&&!r.done&&r.d<today()){tg.classList.add('late');tg.textContent+=' (overdue)'}row.querySelector('.nm').appendChild(tg);if(filt!=='All'&&(r.c||'Other')!==filt)row.style.opacity=.35;
    row.onclick=()=>{sel=r.id;render()};
    row.querySelector('.x').onclick=e=>{e.stopPropagation();const idx=risks.indexOf(r);risks=risks.filter(x=>x!==r);if(sel===r.id)sel=null;save();render();toast('Risk removed','Undo',()=>{risks.splice(idx,0,r);save();render()})};
    L.appendChild(row);
  });
  const fw=$('fixwrap'),cur=risks.find(r=>r.id===sel);fw.innerHTML='';
  if(cur){fw.innerHTML='<div class="fixl"></div><textarea class="fix" placeholder="What is the first step to prevent this?"></textarea><input class="fix" id="due" type="date" aria-label="Due date for the prevention step"><button class="chip" id="dn" type="button"></button>';
    fw.querySelector('.fixl').textContent='Prevent: '+cur.t;
    const ta=fw.querySelector('textarea');ta.value=cur.f||'';ta.oninput=()=>{cur.f=ta.value;save()};const du=$('due');du.value=cur.d||'';du.onchange=()=>{cur.d=du.value;save();render()};const dn=$('dn');dn.textContent=cur.done?'Mark as active again':'Mark as handled';dn.onclick=()=>{cur.done=!cur.done;save();render();if(cur.done){burst();chime();toast('Handled. Its danger drops by 70%.')}}}
}
function drag(e,r,o){
  e.preventDefault();sel=r.id;o.setPointerCapture(e.pointerId);tip.style.opacity=0;o.classList.add('drag');
  const mv=ev=>{const b=plane.getBoundingClientRect();
    r.l=Math.min(4.9,Math.max(.2,(ev.clientX-b.left)/b.width*5));
    r.i=Math.min(4.9,Math.max(.2,(b.bottom-ev.clientY)/b.height*5));
